apiVersion: v1
kind: Service
metadata:
  name: {{ include "lgtm-lbac-proxy.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lgtm-lbac-proxy.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.service.webPort }}
      targetPort: http
      protocol: TCP
      name: {{ include "lgtm-lbac-proxy.name" . }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: {{ include "lgtm-lbac-proxy.name" . }}-metrics
    {{- with .Values.auth }}{{- with .clientCert }}{{- if and .enabled (eq (.source | default "mtls") "mtls") .mtlsPort }}
    - port: {{ .mtlsPort }}
      targetPort: mtls
      protocol: TCP
      name: {{ include "lgtm-lbac-proxy.name" $ }}-mtls
    {{- end }}{{- end }}{{- end }}
  selector:
    {{- include "lgtm-lbac-proxy.selectorLabels" . | nindent 4 }}
  type: {{ .Values.service.type | default "ClusterIP" }}
{{- with .Values.auth }}{{- with .clientCert }}{{- if and .enabled (eq (.source | default "mtls") "mtls") .mtlsPort $.Values.service.mtlsLoadBalancer.enabled }}
---
# Dedicated LoadBalancer exposing ONLY the mTLS port; reuses the chart's pod selector
# and the mtls targetPort, so the plain HTTP and metrics ports stay internal.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lgtm-lbac-proxy.name" $ }}-mtls
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "lgtm-lbac-proxy.labels" $ | nindent 4 }}
  {{- with $.Values.service.mtlsLoadBalancer.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with $.Values.service.mtlsLoadBalancer.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector:
    {{- include "lgtm-lbac-proxy.selectorLabels" $ | nindent 4 }}
  ports:
    - port: {{ $.Values.service.mtlsLoadBalancer.port | default .mtlsPort }}
      targetPort: mtls
      protocol: TCP
      name: mtls
{{- end }}{{- end }}{{- end }}
